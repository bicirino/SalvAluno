name: SalvAluno - CI Pipeline 

on:
  push: 
    branches: 
      - main 
  pull_request:
    branches:
      - main

jobs: 
  build-and-test: 
    name: Compilar e Testar o Projeto 
    runs-on: ubuntu-latest 

    steps: 
      # === 1. Checkout e Configuração do Ambiente ===
      - name: Checkout do repositório 
        uses: actions/checkout@v4 

      - name: Configurar Java 17
        uses: actions/setup-java@v4 
        with: 
          java-version: '17' 
          distribution: 'temurin'
          cache: 'maven'

      # === 2. Dependências do Playwright ===
      - name: Instalar Navegadores do Playwright 
        run: mvn exec:java "-Dexec.mainClass=com.microsoft.playwright.CLI" "-Dexec.args=install --with-deps chromium"

      # === 3. Execução dos Testes ===
      - name: Executar os testes 
        env: 
          PORTAL_RA: ${{ secrets.PORTAL_RA }} 
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
        run: mvn test 

      # === 4. Empacotamento do Projeto === 
      - name: Gerar artefato JAR 
        run: mvn package -DskipTests