
# Credenciais de acesso ao portal da faculdade 
portal.url= https://ea.uniceub.br/Sistema/Acesso/Login 
portal.RA=${PORTAL_RA:seu_ra_aqui}
portal.password=${PORTAL_PASSWORD: sua_senha_aqui}

# Banco em Memória (H2) 
spring.datasource.url=jdbc:h2:mem:salvaluno;DB_CLOSE_DELAY=-1 
spring.datasource.driverClassName=org.h2.Driver 
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true 
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect 
spring.jpa.hibernate.ddl-auto=update 